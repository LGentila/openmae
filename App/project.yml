# The macOS app. The Xcode project is generated from this file, never edited by hand:
#
#   xcodegen generate --spec App/project.yml
#
# (or simply: zsh scripts/build-app.sh, which generates, builds and prints the path of the app).
#
# The app's name, "OpenMaé", appears here (CFBundleName, CFBundleDisplayName, and its translations in
# Resources/InfoPlist.xcstrings) and in Sources/VoiceCore/AppIdentity.swift. Files and folders use the plain
# spelling "OpenMae" (OpenMae.app): codesign refuses an executable whose name has an accent, so macOS shows
# the accented name through the "localized display name", like Apple's own apps.

name: OpenMae

options:
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  VoiceEngine:
    path: ..

settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64  # Apple Silicon only
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Also builds the English tables (en.lproj), which the string catalogs leave out since English is their
    # source language: French being the development region (CFBundleDevelopmentRegion, below), an English Mac
    # would otherwise fall back to the French table. So every text of Resources/InfoPlist.xcstrings needs its
    # English value too, or English Macs would see its key.
    XCSTRINGS_FORCE_BUILD_ALL_STRINGS: YES

targets:
  OpenMae:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - silero_vad.mlmodelc
          - silero_vad.mlmodelc/**
      # Voice activity model (640 KB, MIT), shipped inside the app: copied as-is (already compiled).
      - path: Resources/silero_vad.mlmodelc
        type: folder
        buildPhase: resources
    dependencies:
      - package: VoiceEngine
        product: VoiceCore
      - package: VoiceEngine
        product: VoiceEngineApple
      - package: VoiceEngine
        product: OpenMaeLink
    info:
      path: Resources/Info.plist
      properties:
        # Same as the file name, so that macOS shows the translated name ("OpenMaé", InfoPlist.xcstrings).
        CFBundleName: OpenMae
        CFBundleDisplayName: OpenMae
        LSHasLocalizedDisplayName: true
        # The interface's source text is English with a French translation; French stays the language
        # of Macs set to neither French nor English (English ones: see XCSTRINGS_FORCE_BUILD_ALL_STRINGS).
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr, en]
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "3"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        # Shown from Resources/InfoPlist.xcstrings, in English as in French: change it there too.
        NSMicrophoneUsageDescription: >-
          The assistant listens to what you say in order to answer. Sound never leaves this Mac.
        # Actions (Settings › Actions): asked the first time the user requests something that needs them.
        # Shown from Resources/InfoPlist.xcstrings too.
        NSCalendarsFullAccessUsageDescription: >-
          Maé adds the events you ask for to your calendar and reads it to you when you ask what is planned.
        NSRemindersFullAccessUsageDescription: >-
          Maé adds the reminders you ask for and reads you those still to do.
        # The built-in sources (Settings › Search the internet): "here" for the weather and the travel times, asked the
        # first time the user asks for one without naming a place. Shown from Resources/InfoPlist.xcstrings too.
        NSLocationUsageDescription: >-
          Maé uses your Mac’s location for the weather and the travel times “from here”, when you don’t name a place.
          She doesn’t keep it.
        NSLocationWhenInUseUsageDescription: >-
          Maé uses your Mac’s location for the weather and the travel times “from here”, when you don’t name a place.
          She doesn’t keep it.
        # The iPhone app finds this Mac on the local network (Settings › iPhone and iPad), and the connected tools
        # (Settings › Connected tools) are reached there. Shown from Resources/InfoPlist.xcstrings too.
        NSLocalNetworkUsageDescription: >-
          Your iPhone finds this Mac on your Wi-Fi to talk to Maé, and Maé reaches the tools you connect on your
          network, such as Home Assistant.
        NSBonjourServices: [_openmae._udp]
        # A connected tool at a plain http:// address of the home network (homeassistant.local, an IP address); any
        # other address stays https:// only.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Resources/App.entitlements
      properties:
        # Hardened runtime: the app needs the microphone, the calendar and reminders for the actions (one
        # entitlement covers both), and the location for the built-in sources. No App Sandbox (the models live in ~/Library/Application Support/<name>/Models,
        # shared with the command-line tool), so no network entitlement is needed either (it only exists inside the
        # sandbox).
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.calendars: true
        # The Mac's location, for "here" (the built-in sources).
        com.apple.security.personal-information.location: true
    # Signing: Signing.xcconfig, completed on each Mac by Signing.local.xcconfig (not published: each Mac signs
    # with its own Apple Developer team). Distributed builds need a "Developer ID Application" certificate.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: OpenMae
        # Derived from the GitHub repository (github.com/lgentilla/openmae); may change before the first release.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lgentilla.openmae
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        DEAD_CODE_STRIPPING: YES
