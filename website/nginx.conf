# The OpenMaé website, served as static files on port 8080, behind a reverse proxy that terminates TLS for
# openmae.com.

# The audience measurement (Umami, a.openmae.com) is the only other origin a page may use. The pairing page's address
# holds a pairing code after "#": its policy allows no other origin at all. (For /p/, try_files serves /p//index.html.)
map $uri $analytics_script {
    ~^/p(/+(index\.html)?)?$  "";
    default                   " https://a.openmae.com";
}
map $uri $analytics_connect {
    ~^/p(/+(index\.html)?)?$  "'none'";
    default                   "https://a.openmae.com";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # Redirects stay relative, so they keep the scheme and host the proxy received.
    absolute_redirect off;

    # /p is where the Mac's pairing QR code leads (openmae.com/p#…): /p/index.html is served for it as it is, without
    # a redirect. The part after "#" never reaches the server anyway.
    #
    # Pages, styles and scripts are checked again at each visit (a 304 when nothing changed): their names carry no
    # version, so a longer cache, a CDN's included, would mix a new page with an old style sheet. The fonts never change.
    location / {
        try_files $uri $uri/index.html =404;
        expires epoch;
    }

    location /assets/ {
        expires epoch;
    }

    location /assets/fonts/ {
        expires 1y;
    }

    # Universal links: the iPhone app declares applinks:openmae.com, and Apple's CDN fetches this file (no extension) to
    # learn that /p opens in that app. It must be JSON, answered at once: no redirect.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }

    error_page 404 /404.html;

    # No page has an inline script or style: keep it that way.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'$analytics_script; connect-src $analytics_connect; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    # Browsers keep to HTTPS for openmae.com once they get it through the proxy (they ignore it over plain HTTP). Not
    # for the subdomains: the relay and the inbound deliveries have their own rules.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
}
